version: "3.9"

services:

  # ── Backend Despachos ────────────────────────────────────────────────────────
  backend-despachos:
    build:
      context: .
      dockerfile: Dockerfile
    image: gonzalo25u/backend-despachos:latest
    container_name: backend-despachos
    restart: unless-stopped
    environment:
      # IP privada de EC2 "data" donde corre MySQL
      DB_ENDPOINT: ${DB_ENDPOINT:-10.0.152.195}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      # 8080 en el host → 8081 donde corre Tomcat dentro del contenedor
      - "8080:8081"
    volumes:
      # Named volume para logs persistentes del backend
      - despachos_logs:/app/logs
    networks:
      - app-network

volumes:
  # Named volume para persistencia de logs.
  # Se prefiere named volume sobre bind mount por portabilidad y porque
  # Docker gestiona el ciclo de vida sin depender de rutas del host.
  despachos_logs:
    driver: local

networks:
  app-network:
    driver: bridge